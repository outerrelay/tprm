<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TPRM Platform{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f5f6fa; }
    .sidebar {
      min-height: calc(100vh - 56px);
      background: #fff;
      border-right: 1px solid #e9ecef;
      padding-top: 1rem;
    }
    .sidebar .nav-link {
      color: #495057;
      padding: .45rem 1rem;
      border-radius: .375rem;
      margin: .1rem .5rem;
    }
    .sidebar .nav-link:hover { background: #f0f4ff; color: #0d6efd; }
    .sidebar .nav-link.active { background: #e8f0fe; color: #0d6efd; font-weight: 500; }
    .sidebar .nav-link i { margin-right: .4rem; }
    .sidebar .nav-section {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #adb5bd;
      padding: .75rem 1.5rem .25rem;
    }
    .main-content { padding: 2rem 2rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="height:56px;">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-shield-check me-1"></i> TPRM Platform
    </a>
    {% if user.is_authenticated %}
    <div class="d-flex align-items-center gap-2">
      <span class="text-light small opacity-75">{{ user.username }}</span>
      <form method="post" action="/accounts/logout/" class="d-inline">
        {% csrf_token %}
        <button class="btn btn-sm btn-outline-light" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>

<div class="container-fluid p-0">
  <div class="row g-0">
    {% if user.is_authenticated %}
    <nav class="col-md-2 d-none d-md-block sidebar">
      <div class="nav flex-column">
        <span class="nav-section">Risk Management</span>
        <a href="{% url 'vendors:vendor_list' %}"
           class="nav-link {% if 'vendors' in request.path %}active{% endif %}">
          <i class="bi bi-building"></i> Vendors
        </a>
      </div>
    </nav>
    <main class="col-md-10 main-content">
    {% else %}
    <main class="col-12 main-content">
    {% endif %}

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
