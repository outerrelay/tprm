<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PERIMETER{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* ═══ CODEC PROTOCOL — iDROID FIELD EDITION ═══ */
    :root {
      --tac-bg:       #b8c8d4;   /* light steel blue — page bg */
      --tac-surface:  #dce8f0;   /* card / panel surface */
      --tac-surface2: #c8d8e4;   /* elevated surface */
      --tac-navy:     #1a2c3c;   /* navbar */
      --tac-sidebar:  #2a4458;   /* sidebar background */
      --tac-border:   #7a9aae;   /* default borders */
      --tac-border2:  #4a7a94;   /* highlighted borders */
      --tac-amber:    #9a8620;   /* military olive-gold — primary accent */
      --tac-amber-hi: #c0a828;   /* bright olive-gold */
      --tac-cyan:     #2a8ab8;   /* iDROID cyan — links / selection */
      --tac-red:      #8c1c18;   /* critical / danger */
      --tac-green:    #1e6030;   /* ok / safe */
      --tac-text:     #182838;   /* primary text — dark navy */
      --tac-heading:  #0c1820;   /* headings */
      --tac-light:    #f0f5f8;   /* near-white for sidebar text */
      --tac-muted:    #4e6878;   /* muted text */
      --tac-muted2:   #8aaabb;   /* very muted — sidebar secondary */
    }

    html, body {
      background-color: var(--tac-bg) !important;
      color: var(--tac-text);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
    }

    /* Very subtle scanline — barely visible on light bg */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.018) 3px,
        rgba(0, 0, 0, 0.018) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── TYPOGRAPHY ── */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Rajdhani', 'Arial Narrow', sans-serif;
      color: var(--tac-heading);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    a { color: var(--tac-cyan); }
    a:hover { color: var(--tac-amber-hi); }

    .text-muted { color: var(--tac-muted) !important; }
    .text-primary { color: var(--tac-amber) !important; }
    .fw-semibold { color: var(--tac-heading); }

    dt {
      color: var(--tac-amber) !important;
      font-family: 'Share Tech Mono', monospace;
      font-size: .76rem !important;
      text-transform: uppercase;
      letter-spacing: .07em;
    }
    dd {
      color: var(--tac-text);
      font-family: 'Share Tech Mono', monospace;
      font-size: .84rem;
    }

    /* ── NAVBAR — dark navy bar like MGS top strip ── */
    .navbar {
      background: var(--tac-navy) !important;
      border-bottom: 2px solid var(--tac-amber) !important;
    }
    .navbar-brand {
      color: var(--tac-amber-hi) !important;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .tac-user {
      color: var(--tac-muted2) !important;
      font-family: 'Share Tech Mono', monospace;
      font-size: .75rem;
    }

    /* ── SIDEBAR — iDROID steel-blue left panel ── */
    .sidebar {
      min-height: calc(100vh - 56px);
      background: var(--tac-sidebar) !important;
      border-right: 2px solid var(--tac-border2) !important;
      padding-top: 1rem;
    }
    .sidebar .nav-section {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: var(--tac-amber-hi);
      padding: .75rem 1.5rem .25rem;
      font-family: 'Share Tech Mono', monospace;
    }
    .sidebar .nav-link {
      color: var(--tac-muted2);
      padding: .45rem 1rem;
      border-radius: 0;
      margin: .1rem 0;
      font-family: 'Share Tech Mono', monospace;
      font-size: .88rem;
      border-left: 3px solid transparent;
      transition: all 0.12s ease;
    }
    .sidebar .nav-link:hover {
      background: rgba(42, 138, 184, 0.18);
      color: #ffffff;
      border-left-color: var(--tac-cyan);
    }
    .sidebar .nav-link.active {
      background: rgba(42, 138, 184, 0.28);
      color: #ffffff;
      border-left-color: var(--tac-cyan);
      font-weight: 600;
    }
    .sidebar .nav-link i { margin-right: .4rem; }

    /* ── MAIN CONTENT ── */
    .main-content {
      padding: 2rem 2rem;
      background: var(--tac-bg);
    }

    /* ── CARDS — light steel panel with corner brackets ── */
    .card, .tac-card {
      background: var(--tac-surface) !important;
      border: 1px solid var(--tac-border) !important;
      border-radius: 0 !important;
      box-shadow: 1px 2px 6px rgba(20, 40, 60, 0.12) !important;
    }
    .card-header {
      background: var(--tac-surface2) !important;
      border-bottom: 1px solid var(--tac-border) !important;
      color: var(--tac-heading) !important;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: .07em;
      font-size: .88rem;
    }
    .card-body { color: var(--tac-text); }

    .tac-card { position: relative; }
    .tac-card::before, .tac-card::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--tac-cyan);
      border-style: solid;
      pointer-events: none;
      z-index: 1;
    }
    .tac-card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .tac-card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .tac-card-header {
      background: var(--tac-sidebar);
      border-bottom: 1px solid var(--tac-border2);
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .88rem;
      padding: .5rem 1rem;
    }

    /* ── STAT CARDS ── */
    .tac-stat-card {
      background: var(--tac-surface);
      border: 1px solid var(--tac-border);
      padding: .5rem .85rem;
      font-family: 'Share Tech Mono', monospace;
      position: relative;
      overflow: hidden;
      box-shadow: 1px 2px 4px rgba(20, 40, 60, 0.1);
    }
    .tac-stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--tac-cyan);
      opacity: 0.6;
    }
    .tac-stat-label {
      color: var(--tac-muted);
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      display: block;
    }

    /* ── TABLES — iDROID list style ── */
    .table {
      color: var(--tac-text);
      border-color: var(--tac-border);
      font-family: 'Share Tech Mono', monospace;
      font-size: .875rem;
    }
    .table thead th {
      background: var(--tac-sidebar) !important;
      color: #ffffff !important;
      border-bottom: 2px solid var(--tac-cyan) !important;
      border-color: var(--tac-border2) !important;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-size: .72rem;
      font-weight: normal;
      font-family: 'Share Tech Mono', monospace;
    }
    .table tbody tr { border-color: var(--tac-border); }
    .table tbody tr:nth-child(even) { background-color: rgba(0, 0, 0, 0.04); }
    .table-hover tbody tr:hover {
      background-color: rgba(42, 138, 184, 0.14) !important;
      color: var(--tac-heading) !important;
    }
    .table td, .table th { border-color: var(--tac-border); }

    /* ── BUTTONS ── */
    .btn {
      border-radius: 0 !important;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .btn-primary {
      background: var(--tac-sidebar) !important;
      border: 1px solid var(--tac-cyan) !important;
      color: #ffffff !important;
      font-size: .85rem;
      transition: all .12s ease;
    }
    .btn-primary:hover, .btn-primary:focus {
      background: var(--tac-cyan) !important;
      border-color: var(--tac-cyan) !important;
      color: #ffffff !important;
      box-shadow: 0 0 8px rgba(42, 138, 184, 0.35) !important;
    }
    .btn-outline-secondary {
      border: 1px solid var(--tac-border2) !important;
      color: var(--tac-muted) !important;
      background: transparent !important;
      font-size: .8rem;
      transition: all .12s ease;
    }
    .btn-outline-secondary:hover {
      background: var(--tac-sidebar) !important;
      color: #ffffff !important;
      border-color: var(--tac-sidebar) !important;
    }
    .btn-outline-light {
      border-color: var(--tac-muted2) !important;
      color: var(--tac-muted2) !important;
      font-size: .78rem !important;
    }
    .btn-outline-light:hover {
      background: rgba(255,255,255,0.1) !important;
      color: #fff !important;
    }
    .btn-close { filter: opacity(0.45); }

    /* ── BADGES ── */
    .badge {
      border-radius: 0 !important;
      font-family: 'Share Tech Mono', monospace;
      font-size: .7rem;
      font-weight: normal;
      letter-spacing: .04em;
      padding: .22em .55em;
      border: 1px solid transparent;
    }
    .badge-tac-critical {
      background: #f0d0ce;
      color: var(--tac-red);
      border-color: #c87870;
    }
    .badge-tac-high {
      background: #f0e8c8;
      color: #705010;
      border-color: #c8a840;
    }
    .badge-tac-medium {
      background: #cce0ee;
      color: #1a5878;
      border-color: var(--tac-border2);
    }
    .badge-tac-ok {
      background: #c8e8d4;
      color: #185828;
      border-color: #60b070;
    }
    .badge-tac-warn {
      background: #f0e8c8;
      color: #705010;
      border-color: #c8a840;
    }
    .badge-tac-info {
      background: #cce0ee;
      color: #1a5878;
      border-color: var(--tac-border2);
    }
    .badge-tac-off {
      background: #d4dce4;
      color: var(--tac-muted);
      border-color: var(--tac-border);
    }
    .badge-tac-category {
      background: #c8dce8;
      color: #1a4a60;
      border-color: var(--tac-border2);
    }

    /* ── FORMS ── */
    .form-control, .form-select {
      background: #f0f5f8 !important;
      border: 1px solid var(--tac-border2) !important;
      color: var(--tac-text) !important;
      border-radius: 0 !important;
      font-family: 'Share Tech Mono', monospace;
    }
    .form-control:focus, .form-select:focus {
      background: #ffffff !important;
      border-color: var(--tac-cyan) !important;
      color: var(--tac-heading) !important;
      box-shadow: 0 0 0 2px rgba(42, 138, 184, 0.2) !important;
    }
    .form-control.is-invalid { border-color: var(--tac-red) !important; }
    .form-label {
      color: var(--tac-sidebar);
      font-family: 'Share Tech Mono', monospace;
      font-size: .76rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: .3rem;
    }
    .form-text { color: var(--tac-muted); font-size: .76rem; }
    .invalid-feedback { color: var(--tac-red); font-size: .78rem; font-family: 'Share Tech Mono', monospace; }

    /* ── BREADCRUMBS ── */
    .breadcrumb {
      font-family: 'Share Tech Mono', monospace;
      font-size: .78rem;
    }
    .breadcrumb-item a { color: var(--tac-cyan); text-decoration: none; }
    .breadcrumb-item a:hover { color: var(--tac-amber-hi); }
    .breadcrumb-item.active { color: var(--tac-muted); }
    .breadcrumb-item + .breadcrumb-item::before {
      color: var(--tac-border2);
      content: '//';
      padding: 0 .35rem;
    }

    /* ── ALERTS ── */
    .alert {
      border-radius: 0;
      border-left-width: 3px;
      font-family: 'Share Tech Mono', monospace;
      font-size: .84rem;
    }
    .alert-success  { background: #d4eedd !important; border-color: var(--tac-green) !important; color: var(--tac-green) !important; }
    .alert-danger   { background: #f0d4d2 !important; border-color: var(--tac-red)   !important; color: var(--tac-red)   !important; }
    .alert-warning  { background: #f0e8c8 !important; border-color: var(--tac-amber) !important; color: #705010         !important; }
    .alert-info     { background: #cce0ee !important; border-color: var(--tac-cyan)  !important; color: #1a5878         !important; }

    /* ── LOGIN PANEL ── */
    .tac-login-panel {
      background: var(--tac-surface);
      border: 1px solid var(--tac-border2);
      padding: 2rem;
      position: relative;
      box-shadow: 2px 4px 12px rgba(20, 40, 60, 0.18);
    }
    .tac-login-panel::before, .tac-login-panel::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--tac-cyan);
      border-style: solid;
      pointer-events: none;
    }
    .tac-login-panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .tac-login-panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg" style="height:56px;">
  <div class="container-fluid px-3">
    <a class="navbar-brand" href="/">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:inline-block;vertical-align:-.2em;margin-right:.35rem"><circle cx="9" cy="9" r="7.8" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1.2" x2="9" y2="5.5" stroke="currentColor" stroke-width="1.1"/><line x1="9" y1="12.5" x2="9" y2="16.8" stroke="currentColor" stroke-width="1.1"/><line x1="1.2" y1="9" x2="5.5" y2="9" stroke="currentColor" stroke-width="1.1"/><line x1="12.5" y1="9" x2="16.8" y2="9" stroke="currentColor" stroke-width="1.1"/><polygon points="9,6.5 9.65,8.11 11.38,8.23 10.05,9.34 10.47,11.02 9,10.1 7.53,11.02 7.95,9.34 6.62,8.23 8.35,8.11" fill="currentColor"/></svg> PERIMETER
    </a>
    {% if user.is_authenticated %}
    <div class="d-flex align-items-center gap-2">
      <span class="tac-user">{{ user.username }}</span>
      <form method="post" action="/accounts/logout/" class="d-inline">
        {% csrf_token %}
        <button class="btn btn-sm btn-outline-light" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>

<div class="container-fluid p-0">
  <div class="row g-0">
    {% if user.is_authenticated %}
    <nav class="col-md-2 d-none d-md-block sidebar">
      <div class="nav flex-column">
        <span class="nav-section">Risk Management</span>
        <a href="{% url 'vendors:vendor_list' %}"
           class="nav-link {% if 'vendors' in request.path %}active{% endif %}">
          <i class="bi bi-building"></i> Vendors
        </a>
      </div>
    </nav>
    <main class="col-md-10 main-content">
    {% else %}
    <main class="col-12 main-content">
    {% endif %}

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
