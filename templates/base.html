<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TPRM Platform{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* ═══ CODEC PROTOCOL — TACTICAL THEME ═══ */
    :root {
      --tac-bg:       #070b10;
      --tac-surface:  #0c1420;
      --tac-surface2: #111d2e;
      --tac-border:   #1e3048;
      --tac-border2:  #2a4a6e;
      --tac-amber:    #c8820a;
      --tac-amber-hi: #e89a14;
      --tac-ice:      #38b2cc;
      --tac-red:      #c0241e;
      --tac-green:    #1a9e4a;
      --tac-text:     #8ab0cc;
      --tac-heading:  #c0d8ee;
      --tac-muted:    #446880;
    }

    html, body {
      background-color: var(--tac-bg) !important;
      color: var(--tac-text);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.04) 3px,
        rgba(0, 0, 0, 0.04) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── TYPOGRAPHY ── */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Rajdhani', 'Arial Narrow', sans-serif;
      color: var(--tac-heading);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    a { color: var(--tac-ice); }
    a:hover { color: var(--tac-amber-hi); }

    .text-muted { color: var(--tac-muted) !important; }
    .text-primary { color: var(--tac-amber) !important; }
    .fw-semibold { color: var(--tac-heading); }

    dt {
      color: var(--tac-amber) !important;
      font-family: 'Share Tech Mono', monospace;
      font-size: .78rem !important;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    dd {
      color: var(--tac-text);
      font-family: 'Share Tech Mono', monospace;
      font-size: .85rem;
    }

    /* ── NAVBAR ── */
    .navbar {
      background: #04070d !important;
      border-bottom: 1px solid var(--tac-amber) !important;
      box-shadow: 0 0 16px rgba(200, 130, 10, 0.18);
    }
    .navbar-brand {
      color: var(--tac-amber) !important;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .tac-user {
      color: var(--tac-muted) !important;
      font-family: 'Share Tech Mono', monospace;
      font-size: .76rem;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      min-height: calc(100vh - 56px);
      background: #080d16 !important;
      border-right: 1px solid var(--tac-border) !important;
      padding-top: 1rem;
    }
    .sidebar .nav-section {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--tac-amber);
      padding: .75rem 1.5rem .25rem;
      font-family: 'Share Tech Mono', monospace;
      opacity: 0.7;
    }
    .sidebar .nav-link {
      color: var(--tac-muted);
      padding: .45rem 1rem;
      border-radius: 0;
      margin: .1rem 0;
      font-family: 'Share Tech Mono', monospace;
      font-size: .88rem;
      border-left: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .sidebar .nav-link:hover {
      background: rgba(200, 130, 10, 0.07);
      color: var(--tac-amber-hi);
      border-left-color: var(--tac-amber);
    }
    .sidebar .nav-link.active {
      background: rgba(200, 130, 10, 0.11);
      color: var(--tac-amber-hi);
      border-left-color: var(--tac-amber);
    }
    .sidebar .nav-link i { margin-right: .4rem; }

    /* ── MAIN CONTENT ── */
    .main-content {
      padding: 2rem 2rem;
      background: var(--tac-bg);
    }

    /* ── CARDS ── */
    .card, .tac-card {
      background: var(--tac-surface) !important;
      border: 1px solid var(--tac-border) !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    .card-header {
      background: var(--tac-surface2) !important;
      border-bottom: 1px solid var(--tac-border) !important;
      color: var(--tac-heading) !important;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: .88rem;
    }
    .card-body { color: var(--tac-text); }

    .tac-card {
      position: relative;
    }
    .tac-card::before, .tac-card::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--tac-amber);
      border-style: solid;
      pointer-events: none;
      z-index: 1;
    }
    .tac-card::before {
      top: -1px; left: -1px;
      border-width: 2px 0 0 2px;
    }
    .tac-card::after {
      bottom: -1px; right: -1px;
      border-width: 0 2px 2px 0;
    }

    .tac-card-header {
      background: var(--tac-surface2);
      border-bottom: 1px solid var(--tac-border);
      color: var(--tac-heading);
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: .88rem;
      padding: .5rem 1rem;
    }

    /* ── STAT CARDS ── */
    .tac-stat-card {
      background: var(--tac-surface);
      border: 1px solid var(--tac-border);
      padding: .5rem .85rem;
      font-family: 'Share Tech Mono', monospace;
      position: relative;
      overflow: hidden;
    }
    .tac-stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--tac-amber);
      opacity: 0.55;
    }
    .tac-stat-label {
      color: var(--tac-muted);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      display: block;
    }

    /* ── TABLES ── */
    .table {
      color: var(--tac-text);
      border-color: var(--tac-border);
      font-family: 'Share Tech Mono', monospace;
      font-size: .875rem;
    }
    .table thead th {
      background: var(--tac-surface2) !important;
      color: var(--tac-amber) !important;
      border-bottom: 1px solid var(--tac-amber) !important;
      border-color: var(--tac-border) !important;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .72rem;
      font-weight: normal;
      font-family: 'Share Tech Mono', monospace;
    }
    .table tbody tr { border-color: var(--tac-border); }
    .table-hover tbody tr:hover {
      background-color: rgba(200, 130, 10, 0.06) !important;
      color: var(--tac-heading) !important;
    }
    .table-hover tbody tr:hover td { color: var(--tac-heading); }
    .table td, .table th { border-color: var(--tac-border); }
    .table-responsive { border: none; }

    /* ── BUTTONS ── */
    .btn {
      border-radius: 0 !important;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .btn-primary {
      background: transparent !important;
      border: 1px solid var(--tac-amber) !important;
      color: var(--tac-amber) !important;
      font-size: .85rem;
      transition: all .15s ease;
    }
    .btn-primary:hover, .btn-primary:focus {
      background: var(--tac-amber) !important;
      color: #04070d !important;
      box-shadow: 0 0 12px rgba(200, 130, 10, 0.35) !important;
    }
    .btn-outline-secondary {
      border: 1px solid var(--tac-border2) !important;
      color: var(--tac-muted) !important;
      font-size: .8rem;
      transition: all .15s ease;
    }
    .btn-outline-secondary:hover, .btn-outline-secondary:focus {
      background: var(--tac-surface2) !important;
      color: var(--tac-ice) !important;
      border-color: var(--tac-ice) !important;
    }
    .btn-outline-light {
      border-color: var(--tac-border2) !important;
      color: var(--tac-muted) !important;
      font-size: .78rem !important;
    }
    .btn-outline-light:hover {
      background: var(--tac-surface2) !important;
      color: var(--tac-text) !important;
      border-color: var(--tac-muted) !important;
    }
    .btn-close { filter: invert(1) opacity(0.35); }

    /* ── BADGES ── */
    .badge {
      border-radius: 0 !important;
      font-family: 'Share Tech Mono', monospace;
      font-size: .7rem;
      font-weight: normal;
      letter-spacing: .05em;
      padding: .22em .5em;
    }
    .badge-tac-critical {
      background: rgba(192, 36, 30, 0.18);
      color: #f05858;
      border: 1px solid var(--tac-red);
      box-shadow: 0 0 6px rgba(192, 36, 30, 0.25);
    }
    .badge-tac-high {
      background: rgba(200, 130, 10, 0.18);
      color: var(--tac-amber-hi);
      border: 1px solid var(--tac-amber);
    }
    .badge-tac-medium {
      background: rgba(56, 178, 204, 0.12);
      color: #5cd4e8;
      border: 1px solid var(--tac-ice);
    }
    .badge-tac-ok {
      background: rgba(26, 158, 74, 0.13);
      color: #2ecc72;
      border: 1px solid var(--tac-green);
    }
    .badge-tac-warn {
      background: rgba(200, 130, 10, 0.13);
      color: var(--tac-amber-hi);
      border: 1px solid var(--tac-amber);
    }
    .badge-tac-info {
      background: rgba(56, 178, 204, 0.12);
      color: #5cd4e8;
      border: 1px solid var(--tac-ice);
    }
    .badge-tac-off {
      background: rgba(30, 48, 72, 0.55);
      color: var(--tac-muted);
      border: 1px solid var(--tac-border2);
    }
    .badge-tac-category {
      background: rgba(56, 178, 204, 0.08);
      color: #48b8cc;
      border: 1px solid rgba(56, 178, 204, 0.35);
    }

    /* ── FORMS ── */
    .form-control, .form-select {
      background: var(--tac-surface) !important;
      border: 1px solid var(--tac-border2) !important;
      color: var(--tac-text) !important;
      border-radius: 0 !important;
      font-family: 'Share Tech Mono', monospace;
    }
    .form-control:focus, .form-select:focus {
      background: var(--tac-surface2) !important;
      border-color: var(--tac-amber) !important;
      color: var(--tac-heading) !important;
      box-shadow: 0 0 0 2px rgba(200, 130, 10, 0.2) !important;
    }
    .form-control::placeholder { color: var(--tac-muted); }
    .form-control.is-invalid {
      border-color: var(--tac-red) !important;
    }
    .form-label {
      color: var(--tac-amber);
      font-family: 'Share Tech Mono', monospace;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: .3rem;
    }
    .form-text { color: var(--tac-muted); font-size: .76rem; }
    .invalid-feedback { color: #f05858; font-size: .78rem; font-family: 'Share Tech Mono', monospace; }

    /* ── BREADCRUMBS ── */
    .breadcrumb {
      font-family: 'Share Tech Mono', monospace;
      font-size: .78rem;
    }
    .breadcrumb-item a {
      color: var(--tac-ice);
      text-decoration: none;
    }
    .breadcrumb-item a:hover { color: var(--tac-amber-hi); }
    .breadcrumb-item.active { color: var(--tac-muted); }
    .breadcrumb-item + .breadcrumb-item::before {
      color: var(--tac-border2);
      content: '//';
      padding: 0 .35rem;
    }

    /* ── ALERTS ── */
    .alert {
      border-radius: 0;
      border-left-width: 3px;
      font-family: 'Share Tech Mono', monospace;
      font-size: .84rem;
    }
    .alert-success {
      background: rgba(26, 158, 74, 0.1) !important;
      border-color: var(--tac-green) !important;
      color: #2ecc72 !important;
    }
    .alert-danger {
      background: rgba(192, 36, 30, 0.1) !important;
      border-color: var(--tac-red) !important;
      color: #f05858 !important;
    }
    .alert-warning {
      background: rgba(200, 130, 10, 0.1) !important;
      border-color: var(--tac-amber) !important;
      color: var(--tac-amber-hi) !important;
    }
    .alert-info {
      background: rgba(56, 178, 204, 0.1) !important;
      border-color: var(--tac-ice) !important;
      color: var(--tac-ice) !important;
    }

    /* ── LOGIN PANEL ── */
    .tac-login-panel {
      background: var(--tac-surface);
      border: 1px solid var(--tac-border2);
      padding: 2rem;
      position: relative;
    }
    .tac-login-panel::before, .tac-login-panel::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--tac-amber);
      border-style: solid;
      pointer-events: none;
    }
    .tac-login-panel::before {
      top: -1px; left: -1px;
      border-width: 2px 0 0 2px;
    }
    .tac-login-panel::after {
      bottom: -1px; right: -1px;
      border-width: 0 2px 2px 0;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg" style="height:56px;">
  <div class="container-fluid px-3">
    <a class="navbar-brand" href="/">
      <i class="bi bi-shield-check me-1"></i> TPRM Platform
    </a>
    {% if user.is_authenticated %}
    <div class="d-flex align-items-center gap-2">
      <span class="tac-user">{{ user.username }}</span>
      <form method="post" action="/accounts/logout/" class="d-inline">
        {% csrf_token %}
        <button class="btn btn-sm btn-outline-light" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>

<div class="container-fluid p-0">
  <div class="row g-0">
    {% if user.is_authenticated %}
    <nav class="col-md-2 d-none d-md-block sidebar">
      <div class="nav flex-column">
        <span class="nav-section">Risk Management</span>
        <a href="{% url 'vendors:vendor_list' %}"
           class="nav-link {% if 'vendors' in request.path %}active{% endif %}">
          <i class="bi bi-building"></i> Vendors
        </a>
      </div>
    </nav>
    <main class="col-md-10 main-content">
    {% else %}
    <main class="col-12 main-content">
    {% endif %}

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
